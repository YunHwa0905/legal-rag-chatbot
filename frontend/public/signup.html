<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI - 회원가입</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #1a3a6b, #0f2447);
            padding: 32px 40px;
            color: #fff;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover { color: #fff; }

        .card-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card-header p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-top: 6px;
        }

        .card-body { padding: 36px 40px; }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 16px;
            color: #111827;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #1a3a6b;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26,58,107,0.08);
        }

        input::placeholder { color: #9ca3af; }

        .age-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 13px;
            color: #1d4ed8;
            display: none;
        }

        .age-preview-icon { font-size: 16px; }

        .btn-primary {
            width: 100%;
            background: #1a3a6b;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: -0.2px;
        }

        .btn-primary:hover { background: #15306b; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,58,107,0.25); }

        .msg {
            font-size: 13px;
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .msg.error { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; }
        .msg.success { color: #16a34a; background: #f0fdf4; border: 1px solid #bbf7d0; }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 13px;
        }

        .login-link a { color: #1a3a6b; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }

        .step-hint {
            display: flex;
            gap: 6px;
            margin-bottom: 28px;
        }

        .step {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: #e5e7eb;
            transition: background 0.3s;
        }

        .step.active { background: #1a3a6b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <a href="/" class="back-link">← 로그인으로 돌아가기</a>
            <h1>회원가입</h1>
            <p>정보를 입력하고 맞춤 법률 상담을 시작하세요</p>
        </div>

        <div class="card-body">
            <div class="step-hint">
                <div class="step active" id="step1"></div>
                <div class="step active" id="step2"></div>
                <div class="step" id="step3"></div>
            </div>

            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="username" placeholder="영문, 숫자 조합">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="password" placeholder="6자 이상 입력">
            </div>
            <div class="form-group">
                <label>나이 <span style="color:#9ca3af;font-weight:400">(맞춤 설명에 사용됩니다)</span></label>
                <input type="number" id="age" placeholder="예: 25" min="1" max="120">
                <div class="age-preview" id="agePreview">
                    <span class="age-preview-icon" id="ageIcon"></span>
                    <span id="ageText"></span>
                </div>
            </div>

            <button class="btn-primary" id="signupBtn">가입 완료</button>
            <div class="msg" id="msg"></div>

            <div class="login-link">
                이미 계정이 있으신가요? <a href="/">로그인</a>
            </div>
        </div>
    </div>

    <script>
        $('#age').on('input', function () {
            const age = parseInt($(this).val());
            $('#step3').toggleClass('active', !!age);

            if (!age) { $('#agePreview').hide(); return; }

            let icon, text;
            if (age <= 10) { icon = '📚'; text = '초등학생 눈높이로 쉽게 설명해드립니다'; }
            else if (age <= 19) { icon = '🎒'; text = '청소년 눈높이로 설명해드립니다'; }
            else if (age <= 40) { icon = '💼'; text = '일반 성인 수준으로 설명해드립니다'; }
            else { icon = '⚖️'; text = '전문 법률 용어로 상세히 설명해드립니다'; }

            $('#ageIcon').text(icon);
            $('#ageText').text(text);
            $('#agePreview').show();
        });

        $('#signupBtn').click(function () {
            const username = $('#username').val().trim();
            const password = $('#password').val().trim();
            const age = parseInt($('#age').val());

            if (!username || !password || !age) {
                showMsg('모든 항목을 입력해주세요.', 'error');
                return;
            }

            $(this).text('처리 중...').prop('disabled', true);

            $.ajax({
                url: 'http://localhost:8080/api/auth/signup',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username, password, age }),
                success: function () {
                    showMsg('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.', 'success');
                    setTimeout(() => window.location.href = '/', 1800);
                },
                error: function (err) {
                    showMsg(err.responseText || '회원가입에 실패했습니다.', 'error');
                    $('#signupBtn').text('가입 완료').prop('disabled', false);
                }
            });
        });

        function showMsg(text, type) {
            $('#msg').text(text).attr('class', 'msg ' + type).show();
        }
    </script>
</body>
</html>
