# ===========================================================
# LexAI 배포 구성
#
#   [브라우저] → frontend(80) ─┬→ 정적 3페이지 (Express)
#                              └→ /api/* → tomcat (Spring Legacy WAR)
#                                             ├→ ai (FastAPI)
#                                             │    ├→ opensearch (BM25 + kNN)
#                                             │    └→ ollama (Gemma 3 4B, GPU)
#                                             └→ SQLite 파일 (사용자·대화)
#
# 외부에 열리는 포트는 frontend 의 80 뿐입니다.
# 9200(OpenSearch) / 11434(Ollama) 는 내부 네트워크에만 존재합니다.
#
# ★ 2026-09 CSP 이관 검증에 맞춰 구성을 줄였습니다.
#   - MySQL  → SQLite 파일 (관리형 DB 를 함께 옮길 필요가 없어집니다)
#   - Redis  → 비활성화    (원래도 없어도 되는 읽기 캐시였습니다)
#   - Caddy  → 제거        (frontend 의 server.js 가 /api 를 프록시합니다)
#
#   HTTPS 가 필요해지면 CSP 의 로드밸런서에서 종료하는 쪽을 권합니다.
#   Caddy 를 되살리려면 git 이력의 이전 버전을 참고하세요.
# ===========================================================

services:

  # ---------------------------------------------------------
  # 프론트엔드 — 정적 파일 + /api 리버스 프록시
  #
  #   Caddy 를 걷어내면서 외부 진입점이 이 서비스가 됐습니다. 화면의
  #   스크립트가 /api 를 상대경로로 호출하므로 프론트와 API 가 같은
  #   오리진이 되어 CORS 가 필요 없습니다 — 프록시를 여기서 처리하는
  #   이유가 그것입니다(server.js 참고).
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: lexai-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://tomcat:8080}
    depends_on:
      tomcat:
        condition: service_started

  # ---------------------------------------------------------
  # 백엔드 — Spring Legacy WAR (Tomcat 9 / Java 11)
  #   ROOT.war 로 배포하므로 컨텍스트 경로 /backend_spring 이 없습니다.
  #   → API 경로는 /api/auth/*, /api/chat
  # ---------------------------------------------------------
  tomcat:
    build:
      context: ./backend_spring
    container_name: lexai-tomcat
    restart: unless-stopped
    environment:
      # DB 는 파일 하나입니다. 아래 경로에 볼륨을 마운트해 두었습니다.
      DB_PATH: ${DB_PATH:-/var/lib/lexai/lexai.db}
      # ★ SQLite 가 시각을 datetime('now','localtime') 으로 기록하는데,
      #   이 localtime 은 JVM 설정이 아니라 컨테이너의 OS 타임존을 따릅니다.
      #   없으면 UTC 로 기록되어 9시간 어긋납니다.
      TZ: ${TZ:-Asia/Seoul}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FASTAPI_URL: ${FASTAPI_URL:-http://ai:8000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-}
    volumes:
      # 사용자·대화 데이터. 이 볼륨 하나가 예전 mysql_data 를 대신합니다.
      - lexai_data:/var/lib/lexai
      # 최초 기동 시 entrypoint 가 이 파일로 스키마를 만듭니다
      # (MySQL 컨테이너의 init.sql 이 하던 역할).
      - ./deploy/schema.sqlite.sql:/opt/schema.sqlite.sql:ro
    expose:
      - "8080"
    depends_on:
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------
  # AI 서버 — FastAPI + RAG
  # ---------------------------------------------------------
  ai:
    build:
      context: ./ai
    container_name: lexai-ai
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ENV: production

      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-opensearch}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-legal_documents}
      OPENSEARCH_USE_SSL: ${OPENSEARCH_USE_SSL:-true}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-legal-gemma}
      OLLAMA_REWRITE_MODEL: ${OLLAMA_REWRITE_MODEL:-gemma3:1b}

      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.5}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-768}
      TEMPERATURE: ${TEMPERATURE:-0.1}
      TOP_P: ${TOP_P:-0.9}

      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      # 프록시 뒤 단일 오리진이라 CORS 불필요. 값이 있으면 그 오리진만 허용.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGIN:-}
      # 임베딩 모델(약 450MB) 캐시 위치 — 볼륨에 두어 재기동 시 재다운로드 방지
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8000"
    depends_on:
      opensearch:
        condition: service_healthy
      ollama:
        condition: service_started
      # 모델 준비가 끝난 뒤에 뜹니다 — "컨테이너는 다 올라왔는데 채팅만 실패" 를 막습니다.
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      # 앱 시작 시 lifespan 에서 임베딩 모델을 미리 로드하므로
      # 최초 기동은 수십 초~수 분 걸립니다. start_period 를 넉넉히 둡니다.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  # ---------------------------------------------------------
  # LLM — Ollama (NVIDIA T4 사용)
  #   최초 1회 모델 생성이 필요합니다: bash deploy/ollama-init.sh
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: lexai-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # 유휴 시 모델을 VRAM 에서 내리지 않음 → 첫 질문 지연 제거
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_models:/root/.ollama   # 모델 5GB — 반드시 볼륨(EBS)
    expose:
      - "11434"
    # GPU 할당. 이 블록이 없으면 에러 없이 CPU 로 폴백해 응답이 1~3분으로 느려집니다.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------
  # 모델 준비 — 일회성 초기화 (deploy/ollama-init.sh 를 대체)
  #
  #   ollama 이미지에는 모델이 들어있지 않고, ollama create 는 데몬이 떠 있어야
  #   동작합니다. 그래서 빌드 시점이 아니라 기동 직후에 한 번 돌려야 합니다.
  #   이 서비스가 그 역할을 맡아 docker compose up -d 한 번으로 모델까지
  #   준비되게 합니다 — 이관 시 "명령 하나로 환경이 올라오는지" 가 중요합니다.
  #
  #   pull 은 캐시되고 생성 여부를 먼저 확인하므로 여러 번 실행해도 안전합니다.
  #
  #   $$ 는 compose 변수 치환을 피해 셸로 그대로 넘기기 위한 이스케이프입니다.
  #   ${OLLAMA_MODEL} 처럼 $ 가 하나인 것은 .env 에서 읽어오려는 의도입니다.
  # ---------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: lexai-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # CLI 가 바라볼 서버 주소 (ollama 서비스의 바인딩 주소와는 별개입니다)
      OLLAMA_HOST: http://ollama:11434
      TARGET_MODEL: ${OLLAMA_MODEL:-legal-gemma}
      REWRITE_MODEL: ${OLLAMA_REWRITE_MODEL:-gemma3:1b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ollama list | grep -q "^$${TARGET_MODEL}"; then
          echo "[SKIP] $${TARGET_MODEL} 이미 존재"
        else
          BASE=""
          for tag in gemma3:4b-it-q8_0 gemma3:4b; do
            if ollama pull "$$tag"; then BASE="$$tag"; break; fi
          done
          [ -n "$$BASE" ] || { echo "[FATAL] 베이스 모델 다운로드 실패"; exit 1; }
          { echo "FROM $$BASE"; echo "PARAMETER temperature 0.1"; echo "PARAMETER top_p 0.9"; echo "PARAMETER num_ctx 4096"; echo "PARAMETER repeat_penalty 1.1"; } > /tmp/Modelfile
          ollama create "$${TARGET_MODEL}" -f /tmp/Modelfile
        fi
        if ollama list | grep -q "^$${REWRITE_MODEL}"; then
          echo "[SKIP] $${REWRITE_MODEL} 이미 존재"
        else
          ollama pull "$${REWRITE_MODEL}"
        fi
        echo "[DONE] 모델 준비 완료"

  # ---------------------------------------------------------
  # 벡터 DB — OpenSearch 2.13 (단일 노드)
  # ---------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: lexai-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}
      # 2.12 부터 필수. 없으면 부팅 실패합니다.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      # 스냅샷 복원용 경로 등록 (학교에서 가져온 인덱스를 restore 할 때 사용)
      - path.repo=/mnt/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data   # 인덱스 253,207건 — 반드시 볼륨
      - ./deploy/snapshots:/mnt/snapshots            # 스냅샷 tar 를 여기에 풀어둡니다
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ---------------------------------------------------------
  # 제거된 서비스 — mysql, redis, caddy
  #
  #   CSP 간 이관에서 함께 옮겨야 할 것을 줄이려고 걷어냈습니다.
  #   기능은 그대로이며, 각 단계마다 합격 기준을 다시 통과시켰습니다.
  #
  #   mysql → SQLite 파일 (tomcat 의 lexai_data 볼륨)
  #           덤프/복원이 파일 복사가 됩니다.
  #   redis → 비활성화 (root-context.xml 의 빈 3개를 주석 처리)
  #           원래도 순수 읽기 캐시라 없으면 캐시 미스가 될 뿐입니다.
  #   caddy → frontend 의 server.js 가 /api 를 프록시합니다.
  #           HTTPS 가 필요해지면 CSP 로드밸런서에서 종료하세요.
  #
  #   되살리려면 git 이력의 이전 버전을 참고하세요.
  # ---------------------------------------------------------

# ===========================================================
# 볼륨 — 재기동/재빌드해도 살아남아야 하는 데이터
#
# ★ 주의: g4dn 인스턴스의 NVMe 는 임시 스토리지라 stop/start 시
#         삭제됩니다. 이 볼륨들은 도커 기본 위치
#         (/var/lib/docker/volumes → 루트 EBS) 에 있어야 안전합니다.
# ===========================================================
volumes:
  lexai_data:        # SQLite DB — 사용자·대화 (예전 mysql_data)
  opensearch_data:   # 색인 253,207건 — 이관 시 스냅샷으로 옮깁니다
  ollama_models:     # LLM 5GB — 이관 불필요(대상에서 자동 다운로드)
  hf_cache:          # 임베딩 모델 450MB — 이관 불필요
